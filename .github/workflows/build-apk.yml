name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: flutter --version

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Rename APK for Release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk Al-Qalam-Public-School-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Qalam-Public-School-Release-APK-v1.1.0
          path: Al-Qalam-Public-School-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: Al-Qalam Mobile Suite v1.1.0
          body: |
            ### 🏫 Al-Qalam Public School Mobile Management Suite v1.1.0
            - **Session**: 2026-27
            - **Updates**:
              - Administrator Dashboard with Website Management (CMS)
              - Live Photo Gallery Sync (Add/Delete photos)
              - Live Notices Board Sync
              - Online Admission Inquiries Hub with Call / WhatsApp
              - Configured Primary Administrator Role & Website CMS
            - **Package**: `Al-Qalam-Public-School-Release.apk`
            - **Target Android**: Android 8.0+
          files: Al-Qalam-Public-School-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
